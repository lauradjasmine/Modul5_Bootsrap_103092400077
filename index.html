<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Ruang Baca</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100">

  <nav class="navbar navbar-expand-lg navbar-dark bg-success py-3">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="#">Ruang Baca</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuNavbar">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link text-white" href="#">Beranda</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="#">Tentang</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="#">Bantuan</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
        <div class="card border-0 shadow">
          <div class="card-body p-4">
            <h1 class="h3 text-center mb-2">Masuk ke Ruang Baca</h1>
            <p class="text-center text-secondary small mb-4">Temukan bacaan untuk hari ini.</p>
            <form>
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" placeholder="Masukkan username">
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Masukkan password">
              </div>
              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="ingatSaya">
                <label class="form-check-label" for="ingatSaya">Ingat saya</label>
              </div>
              <button type="submit" class="btn btn-success w-100">Masuk</button>
            </form>
          </div>
          <div class="card-footer bg-light text-center py-3">
            <a href="#" class="link-success small">Lupa password?</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
